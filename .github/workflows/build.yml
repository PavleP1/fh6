name: Build Turbo Rush
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Download toolchain
        run: |
          mkdir -p lib build/classes build/stubs dist res
          M=https://repo1.maven.org/maven2/org/microemu
          curl -fL $M/microemu-cldc/2.0.4/microemu-cldc-2.0.4.jar -o lib/cldc.jar
          curl -fL $M/microemu-midp/2.0.4/microemu-midp-2.0.4.jar -o lib/midp.jar
          curl -fL https://github.com/Guardsquare/proguard/releases/download/v7.2.2/proguard-7.2.2.zip -o pg.zip
          unzip -q pg.zip
      - name: Write API stubs
        run: |
          mkdir -p stubs/javax/microedition/media/control
          cat > stubs/javax/microedition/media/Control.java <<'EOF'
          package javax.microedition.media;
          public interface Control {}
          EOF
          cat > stubs/javax/microedition/media/MediaException.java <<'EOF'
          package javax.microedition.media;
          public class MediaException extends Exception {
              public MediaException() {}
              public MediaException(String s) { super(s); }
          }
          EOF
          cat > stubs/javax/microedition/media/Player.java <<'EOF'
          package javax.microedition.media;
          public interface Player {
              void realize() throws MediaException;
              void start() throws MediaException;
              void stop() throws MediaException;
              void close();
              void setLoopCount(int count);
              Control getControl(String type);
          }
          EOF
          cat > stubs/javax/microedition/media/Manager.java <<'EOF'
          package javax.microedition.media;
          import java.io.IOException;
          import java.io.InputStream;
          public class Manager {
              public static Player createPlayer(InputStream stream, String type) throws IOException, MediaException { return null; }
              public static void playTone(int note, int duration, int volume) throws MediaException {}
          }
          EOF
          cat > stubs/javax/microedition/media/control/VolumeControl.java <<'EOF'
          package javax.microedition.media.control;
          import javax.microedition.media.Control;
          public interface VolumeControl extends Control {
              int setLevel(int level);
              int getLevel();
          }
          EOF
      - name: Make icon
        run: |
          python3 - <<'PY'
          import zlib, struct, os
          S, SS = 40, 4
          def rr(x, y, x0, y0, x1, y1, r):
              if x < x0 or x > x1 or y < y0 or y > y1:
                  return False
              cx = min(max(x, x0 + r), x1 - r)
              cy = min(max(y, y0 + r), y1 - r)
              return (x - cx) ** 2 + (y - cy) ** 2 <= r * r
          def sample(x, y):
              if not rr(x, y, 1, 1, 39, 39, 9):
                  return None
              if y < 19:
                  t = y / 19.0
                  c = (int(45 + 210 * t), int(125 + 75 * t), int(210 - 90 * t))
                  if (x - 29) ** 2 + (y - 13) ** 2 < 25:
                      c = (255, 230, 150)
                  if y > 14 + abs(x - 8) * 0.5 and x < 16 or (y > 15 + abs(x - 34) * 0.6 and x > 26):
                      c = (60, 90, 130)
                  return c
              d = y - 19
              hw = d * 0.62 + 1.5
              dx = abs(x - 20)
              if dx < hw:
                  if dx > hw - 2.0:
                      return (230, 30, 30) if int(d / 3) % 2 == 0 else (255, 255, 255)
                  if dx < 0.5 + d * 0.04 and int(d / 3) % 2 == 0:
                      return (255, 255, 255)
                  return (70, 70, 78)
              return (32, 160, 44)
          raw = bytearray()
          for py in range(S):
              raw.append(0)
              for px in range(S):
                  r = g = b = a = 0
                  for sy in range(SS):
                      for sx in range(SS):
                          c = sample(px + (sx + 0.5) / SS, py + (sy + 0.5) / SS)
                          if c:
                              r += c[0]; g += c[1]; b += c[2]; a += 1
                  n = SS * SS
                  if a:
                      raw += bytes((r // a, g // a, b // a, 255 * a // n))
                  else:
                      raw += bytes((0, 0, 0, 0))
          def chunk(t, d):
              c = struct.pack('>I', len(d)) + t + d
              return c + struct.pack('>I', zlib.crc32(t + d) & 0xffffffff)
          png = b'\x89PNG\r\n\x1a\n' + chunk(b'IHDR', struct.pack('>IIBBBBB', S, S, 8, 6, 0, 0, 0)) + chunk(b'IDAT', zlib.compress(bytes(raw), 9)) + chunk(b'IEND', b'')
          os.makedirs('res', exist_ok=True)
          open('res/icon.png', 'wb').write(png)
          PY
      - name: Compile
        run: |
          find stubs -name '*.java' > stubs.txt
          javac -g:none -source 1.3 -target 1.3 -classpath lib/midp.jar:lib/cldc.jar -d build/stubs @stubs.txt
          javac -g:none -source 1.3 -target 1.3 -classpath build/stubs:lib/midp.jar:lib/cldc.jar -d build/classes src/*.java
          jar cf build/in.jar -C build/classes .
      - name: Preverify with ProGuard
        run: |
          java -jar proguard-7.2.2/lib/proguard.jar -injars build/in.jar -outjars build/out.jar \
            -libraryjars "$JAVA_HOME/jre/lib/rt.jar" \
            -libraryjars build/stubs -libraryjars lib/midp.jar -libraryjars lib/cldc.jar \
            -microedition -dontobfuscate -dontoptimize -dontshrink -dontwarn -ignorewarnings \
            -keep "public class * extends javax.microedition.midlet.MIDlet"
      - name: Package JAR + JAD
        run: |
          V="1.0.${GITHUB_RUN_NUMBER}"
          mkdir pre && cd pre && unzip -q ../build/out.jar && rm -rf META-INF && cd ..
          cp res/icon.png pre/icon.png
          printf 'Manifest-Version: 1.0\nMIDlet-1: Turbo Rush, /icon.png, Rush\nMIDlet-Icon: /icon.png\nMIDlet-Name: Turbo Rush\nMIDlet-Vendor: Me\nMIDlet-Version: %s\nMicroEdition-Configuration: CLDC-1.0\nMicroEdition-Profile: MIDP-2.0\n' "$V" > manifest.mf
          jar cfm dist/TurboRush.jar manifest.mf -C pre .
          SIZE=$(stat -c%s dist/TurboRush.jar)
          { sed '1d' manifest.mf; echo "MIDlet-Jar-URL: TurboRush.jar"; echo "MIDlet-Jar-Size: $SIZE"; } > dist/TurboRush.jad
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: TurboRush
          path: dist/
